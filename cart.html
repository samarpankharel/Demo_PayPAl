<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart - Premium T-Shirts</title>

<link rel="stylesheet" href="style.css">


<style>

.cart-container {
    max-width:1000px;
    margin:40px auto;
    padding:0 20px;
}


.cart-header {
    font-size:2rem;
    margin-bottom:30px;
}


.cart-items {

    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    margin-bottom:30px;

}


.cart-item {

    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    border-bottom:1px solid #eee;

}


.item-details {
    flex:1;
}


.item-name {

    font-size:1.1rem;
    font-weight:600;

}


.item-price {

    color:#d9485f;
    font-weight:bold;

}



.item-controls {

    display:flex;
    align-items:center;
    gap:15px;

}



.quantity-control {

    display:flex;
    align-items:center;
    gap:10px;
    background:#f0f0f0;
    padding:6px 12px;
    border-radius:6px;

}



.quantity-control button {

    border:none;
    background:none;
    cursor:pointer;
    font-size:20px;

}



.quantity-control input {

    width:40px;
    text-align:center;
    border:none;
    background:transparent;

}



.remove-btn {

    background:#d9485f;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;

}



.cart-summary {

    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);

}



.summary-row {

    display:flex;
    justify-content:space-between;
    margin-bottom:15px;

}



.summary-row.total {

    border-top:2px solid #eee;
    padding-top:15px;
    font-size:1.2rem;
    font-weight:bold;
    color:#d9485f;

}



.checkout-btns {

    display:flex;
    gap:15px;
    margin-top:20px;

}



.checkout-btns button {

    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;

}



.checkout-btn {

    background:#d9485f;
    color:white;

}



.continue-shopping {

    background:#eee;

}



#paypal-button-container {

    margin-top:30px;
    display:none;

}



</style>

</head>



<body>


<header class="hero">

<h1>
Shopping Cart
</h1>


<p>

<a href="index.html" style="color:white;text-decoration:underline;">

← Back to Shopping

</a>

</p>


</header>





<main class="cart-container">


<h2 class="cart-header">
Your Cart
</h2>




<div 
id="cart-items-container"
class="cart-items">

</div>






<div class="cart-summary">


<div class="summary-row">

<span>
Subtotal:
</span>

<span id="subtotal">
$0.00
</span>

</div>




<div class="summary-row">

<span>
Shipping:
</span>

<span id="shipping">
$0.00
</span>

</div>




<div class="summary-row">

<span>
Tax:
</span>

<span id="tax">
$0.00
</span>

</div>




<div class="summary-row total">

<span>
Total:
</span>

<span id="total">
$0.00
</span>

</div>






<div class="checkout-btns">


<button 
class="checkout-btn"
onclick="showPayPal()">

Proceed to Checkout

</button>




<button
class="continue-shopping"
onclick="window.location.href='index.html'">

Continue Shopping

</button>



</div>





<div id="paypal-button-container">

</div>




</div>


</main>






<!-- PayPal SDK -->

<script src="https://www.paypal.com/sdk/js?client-id=AWYbL9ZC-iztR0_I1Lc5L4GW9lzCo793PXARbuLnM4KtafqFkLCTbKHxcDfO4MDj1k88H41SzQ-EOVzT&currency=USD"></script>




<script src="js/cart.js"></script>

<script src="js/cart-view.js"></script>





<script>


function showPayPal(){


const container =
document.getElementById(
"paypal-button-container"
);



container.style.display="block";



container.scrollIntoView({
behavior:"smooth"
});



if(container.innerHTML.trim() !== ""){
return;
}





paypal.Buttons({



createOrder: async function(){



const total =
cart.calculateTotal();



const response =
await fetch(
"http://localhost:5000/api/payment/create-order",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

amount:total

})

}

);



const order =
await response.json();



return order.id;



},





onApprove: async function(data){



const response =
await fetch(

`http://localhost:5000/api/payment/capture-order/${data.orderID}`,

{

method:"POST"

}

);



const details =
await response.json();



console.log(
"Payment Result:",
details
);



alert(
"Payment Successful!"
);



cart.clearCart();



window.location.href="index.html";



},






onCancel:function(){


alert(
"Payment Cancelled"
);


},





onError:function(error){


console.log(error);


alert(
"Payment Failed"
);


}




}).render(
"#paypal-button-container"
);



}



</script>



</body>

</html>
